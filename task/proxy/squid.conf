# Forward proxy the task container is forced through (HTTP_PROXY/HTTPS_PROXY
# + no other route to the internet — see ../compose.yml). Egress allowlist
# for PLAN.md's "network egress locked to Anthropic + GitHub + package
# registry".
#
# HTTPS is allowed/denied by SNI only (ssl_bump peek + splice): Squid reads
# the hostname out of the TLS ClientHello and either splices the connection
# through untouched or terminates it. It never decrypts, never generates a
# certificate, and the task container never has to trust a MITM CA — this
# is a domain filter, not TLS inspection.

http_port 3128 tls-cert=/etc/squid/certs/squid-ca.pem tls-key=/etc/squid/certs/squid-ca.pem

acl allowed_sites dstdomain "/etc/squid/allowed_domains.txt"
acl allowed_ssl_sites ssl::server_name "/etc/squid/allowed_domains.txt"
acl step1 at_step SslBump1

ssl_bump peek step1
ssl_bump splice allowed_ssl_sites
ssl_bump terminate all

acl CONNECT method CONNECT
http_access allow CONNECT allowed_ssl_sites
http_access deny CONNECT all

http_access allow allowed_sites
http_access deny all

# Default access/cache log locations (/var/log/squid/*), not /dev/stdout:
# squid drops privileges to the unprivileged `proxy` user before opening
# its log, and that user generally can't write the container's stdout fd.
# `docker compose exec proxy tail -f /var/log/squid/access.log` to watch
# live traffic; that's a debugging aid, not this project's Observability
# story (PLAN.md) — the task container's own result.json is.
cache deny all
coredump_dir /tmp
