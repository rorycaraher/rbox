repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_validate
        args:
          - --args=-json
        exclude_types: []
        files: ^infra/
      - id: terraform_tflint
        files: ^infra/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sops-encrypted
        name: verify secrets files are SOPS-encrypted
        entry: scripts/check-sops-encrypted.sh
        language: script
        files: ^infra/secrets\.enc\.yaml$
      - id: sops-metadata-changed
        name: verify SOPS metadata changed alongside secrets content
        entry: scripts/check-sops-metadata-changed.sh
        language: script
        files: ^infra/secrets\.enc\.yaml$
