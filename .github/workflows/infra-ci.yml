name: infra-ci

on:
  pull_request:
    paths:
      - "infra/**"
      - "mise.toml"
      - "mise-tasks/**"
      - ".pre-commit-config.yaml"
      - ".sops.yaml"
      - "scripts/**"
      - ".github/workflows/infra-ci.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history (not the default single-commit shallow clone) --
      # sops-metadata-changed below needs to `git show` the file's content
      # at the PR base / pre-push SHA, which a shallow checkout wouldn't
      # have fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the exact versions pinned in mise.toml (opentofu, tflint,
      # gitleaks, sops, age, pre-commit) — same tool versions as local dev.
      - uses: jdx/mise-action@v2

      # Same hooks as `pre-commit install` runs locally: tofu fmt, tofu
      # validate (init with -backend=false — no Hetzner/R2 credentials ever
      # touch CI), tflint, gitleaks, and the two SOPS checks (encrypted,
      # and metadata-changed-alongside-content). One config drives both
      # local and CI, so there's no separate list of checks to keep in
      # sync.
      - name: pre-commit
        env:
          # The base to diff each SOPS file's content against -- the PR's
          # base SHA, or the SHA before this push. Falls back to HEAD
          # (comparing the checked-out commit against itself, a no-op)
          # for workflow_dispatch (where neither is defined) and for a
          # push whose `before` is the all-zeros SHA (GitHub's signal
          # that it couldn't resolve a real previous ref, e.g. a
          # force-push/history rewrite) -- there's no meaningful base to
          # diff against either way.
          SOPS_METADATA_CHECK_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
        run: mise exec -- pre-commit run --all-files --show-diff-on-failure
